owner: tarunprasadk
repo: yotrackr-status

sites:
  - name: API and database
    url: https://api.yotrackr.com/healthz/deep
    expectedStatusCodes:
      - 200
    maxResponseTime: 3000
  - name: Web app
    url: https://app.yotrackr.com
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000
  - name: Website
    url: https://yotrackr.com
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000

assignees:
  - tarunprasadk

status-website:
  # No custom domain yet: the page lives at tarunprasadk.github.io/yotrackr-status.
  # When status.yotrackr.com is set up, delete baseUrl and add: cname: status.yotrackr.com
  baseUrl: /yotrackr-status
  name: YoTrackr Status
  logoUrl: https://yotrackr.com/logo-full.png
  logoHref: https://yotrackr.com
  hideNavTitle: true
  favicon: https://yotrackr.com/logo-mark.png
  links:
    - rel: preconnect
      href: https://fonts.googleapis.com
    - rel: stylesheet
      href: https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&family=Instrument+Serif:ital@0;1&display=swap
    - rel: stylesheet
      href: https://yotrackr.com/status-theme.css?v=2
  introTitle: "YoTrackr *Status*"
  introMessage: "Live status of the YoTrackr web app, API and website. If something is wrong you will see it here first."
  navbar:
    - title: Status
      href: /
    - title: YoTrackr
      href: https://yotrackr.com
    - title: Contact support
      href: https://yotrackr.com/contact
